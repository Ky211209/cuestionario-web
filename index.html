<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizEli - Simulador Académico</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-brain" style="color: #1a73e8;"></i>
            <h1>QuizEli <span class="subtitle">Académico</span></h1>
        </div>
        <div id="user-display" class="hidden" style="display: flex; align-items: center; gap: 10px;">
            <button id="btn-header-return" class="btn-back hidden"><i class="fas fa-arrow-left"></i> <span>Volver al Menú</span></button>
            <span id="user-info"></span>
            <button id="btn-actualizar" class="btn-secondary" title="Buscar y aplicar actualizaciones"><i class="fas fa-rotate"></i> <span>Actualizar</span></button>
            <button id="btn-logout" class="btn-secondary">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Pantalla de verificación de sesión: evita mostrar "Acceder con Google" mientras Firebase recupera la sesión guardada -->
    <div class="container" id="loading-screen">
        <h2>Verificando sesión...</h2>
        <p style="color:#888; margin-top:10px; font-size:0.9rem;">Un momento, por favor.</p>
    </div>

    <div class="container hidden" id="auth-screen">
        <h2>Bienvenido</h2>
        <button id="btn-login" class="btn-primary" style="margin-top: 20px;">Acceder con Google</button>
    </div>

    <div class="container hidden" id="setup-screen">
        <!-- Saludo -->
        <div id="user-welcome-card" class="menu-hero">
            <div class="hero-text">
                <h2 id="user-welcome-name"></h2>
                <p id="user-welcome-sub"></p>
            </div>
            <p class="hero-hint">Elige una materia para practicar en modo Examen o Estudio.</p>
        </div>

        <!-- Buscador y filtros -->
        <div class="menu-toolbar">
            <label class="menu-search">
                <i class="fas fa-magnifying-glass"></i>
                <input type="search" id="menu-buscar" placeholder="Buscar materia o código" autocomplete="off">
            </label>
            <div class="menu-chips" id="menu-chips" role="group" aria-label="Filtrar por semestre"></div>
            <label class="menu-toggle">
                <input type="checkbox" id="menu-solo-preguntas">
                <span>Solo con preguntas</span>
            </label>
        </div>

        <!-- Materias agrupadas por semestre (las genera script.js) -->
        <div id="menu-secciones"></div>
        <p id="menu-vacio" class="menu-vacio hidden"></p>

        <!-- Panel de inicio: se abre al tocar una tarjeta -->
        <div id="launch-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="launch-title">
            <div class="launch-card" id="launch-card">
                <div class="launch-cover" id="launch-cover">
                    <img id="launch-img" alt="" class="hidden">
                    <i id="launch-icon" class="fas fa-book launch-icon"></i>
                    <button type="button" id="launch-close" class="launch-close" aria-label="Cerrar"><i class="fas fa-xmark"></i></button>
                </div>
                <div class="launch-body">
                    <p id="launch-meta" class="launch-meta"></p>
                    <h3 id="launch-title"></h3>

                    <div class="mode-cards" role="group" aria-label="Modo">
                        <button type="button" class="mode-card active" data-mode="exam">
                            <i class="fas fa-stopwatch"></i>
                            <strong>Examen</strong>
                            <span>20 preguntas al azar con tiempo límite</span>
                        </button>
                        <button type="button" class="mode-card" data-mode="study">
                            <i class="fas fa-book-open-reader"></i>
                            <strong>Estudio</strong>
                            <span>Banco de preguntas con explicación al responder</span>
                        </button>
                    </div>

                    <!-- TIEMPO: Examen → 20/30/60 min | Estudio → 20/30/60 min + Sin límite -->
                    <div id="tiempo-container" class="launch-field">
                        <label for="tiempo-select">Tiempo límite</label>
                        <select id="tiempo-select">
                            <option value="20">20 minutos</option>
                            <option value="30">30 minutos</option>
                            <option value="60">60 minutos</option>
                            <!-- Esta opción solo se muestra en modo Estudio -->
                            <option id="opcion-sin-limite" value="0" style="display:none;">Sin límite de tiempo</option>
                        </select>
                    </div>

                    <!-- CANTIDAD: solo visible en modo Estudio -->
                    <div id="cantidad-container" class="launch-field" style="display: none;">
                        <label for="cantidad-select">Cantidad de preguntas</label>
                        <select id="cantidad-select">
                            <option value="20">20 preguntas</option>
                            <option value="todas">Todas las preguntas</option>
                        </select>
                    </div>

                    <button id="btn-start" class="btn-primary full-width">Iniciar examen</button>
                </div>
            </div>
        </div>

        <!-- Controles heredados (ocultos): el resto del script sigue leyendo estos valores -->
        <div class="hidden" aria-hidden="true">
            <select id="subject-select"></select>
            <select id="mode-select">
                <option value="exam">Examen</option>
                <option value="study">Estudio</option>
            </select>
        </div>

        <p id="admin-link-container" class="hidden" style="display: none;"><a href="admin.html" class="admin-link">Panel Administrativo</a></p>
    </div>

    <div class="container hidden" id="quiz-screen">
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 15px;">
            <span id="timer-label" style="font-size: 0.85rem; color: #888; display: none;"></span>
            <div id="timer-display" style="font-weight: bold; color: #d93025; font-size: 1.1rem;">00:00</div>
        </div>
        <div id="question-text" style="font-weight: bold; text-align: left; margin-bottom: 20px; font-size: 1.1rem;"></div>
        <div id="options-container"></div>
    </div>

    <!-- Aviso de nueva versión (solo aparece si hay una actualización mientras se resuelve un examen o estudio) -->
    <div id="update-banner" class="hidden">
        <span><i class="fas fa-circle-arrow-up"></i> Hay una nueva versión. Se aplicará al volver al menú.</span>
        <button id="btn-banner-actualizar">Actualizar ahora</button>
    </div>

    <!-- ✅ FIX CRÍTICO: Cargar script.js como módulo ES (necesario para los imports de Firebase) -->
    <script type="module" src="script.js"></script>
</body>
</html>
